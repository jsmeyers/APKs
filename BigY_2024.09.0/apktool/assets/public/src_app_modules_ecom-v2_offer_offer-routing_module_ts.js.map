<ion-content>
  <div class="widget-layout">
    <widget-layout *ngIf="loaded" type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  </div>
  <div class="rewards-container">
    <mag-deal-container
      id="rewards-list"
      active-page="rewards"
      [needResetRewardTab]="needResetRewardTab"
    ></mag-deal-container>
  </div>
  <div class="widget-layout">
    <widget-layout *ngIf="loaded" type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
  </div>
</ion-content>
