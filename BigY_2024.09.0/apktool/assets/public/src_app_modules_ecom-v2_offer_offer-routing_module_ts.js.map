<widget-layout
  *ngIf="loaded"
  type="offer"
  [objectId]="'offer/' + offerCode"
  [slug]="router.url"
  zoneName="Fixed Top"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="offer"
  [objectId]="'offer/' + offerCode"
  [slug]="router.url"
  zoneName="Fixed Center"
></widget-layout>

<app-header [isSimpleHeader]="true" [isShowBackButton]="true">
  <ion-title class="title-header">{{ 'offer.title' | translate }}</ion-title>
</app-header>
<ion-content class="ion-padding" #content>
  <ng-container *ngIf="!loaded">
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </ng-container>
  <ng-container *ngIf="loaded">
    <ng-container *ngIf="!offer; else offerDetail">
      <page-not-found></page-not-found>
    </ng-container>
    <ng-template #offerDetail>
      <div class="offer-detail" *ngIf="offer">
        <widget-layout
          type="offer"
          [objectId]="'offer/' + offerCode"
          [slug]="router.url"
          zoneName="Top"
        ></widget-layout>
        <div class="offer-detail__img-box offer-detail__sale-tag" *ngIf="saleTagImageUrl">
          <mag-img [src]="saleTagImageUrl"></mag-img>
        </div>
        <div class="offer-detail__img-box offer-detail__img" *ngIf="offer?.ImageUrl">
          <mag-img [src]="offer?.ImageUrl" ratio="square"></mag-img>
        </div>

        <div class="offer-detail__img-box offer-detail__default-img" *ngIf="!offer?.ImageUrl">
          <mag-img src></mag-img>
        </div>

        <div *ngIf="offer?.DiscountPricing" class="offer-detail__display-name mb-200">
          <ion-text>{{ offer.DiscountPricing }}</ion-text>
        </div>

        <div *ngIf="offer?.Name" class="offer-detail__description mb-200">
          <ion-text>{{ offer.Name }}</ion-text>
        </div>

        <div *ngIf="offer?.SalePriceText" class="offer-detail__sale-text mb-200">
          <ion-text>{{ offer.SalePriceText }}</ion-text>
          <ion-icon src="../assets/icon/phone-ring.svg"></ion-icon>
        </div>

        <div *ngIf="offerExpirationDate" class="offer-detail__expiration-date mb-200">
          <ion-text>{{ 'offer.expires' | translate }}: {{ offerExpirationDate }}</ion-text>
          <mag-deal-expire-badge [expirationDate]="offer?.ExpirationDate"></mag-deal-expire-badge>
        </div>

        <div *ngIf="startDate && endDate" class="offer-detail__valid-date mb-200">
          <ion-text>{{ 'offer.valid' | translate }}: {{ startDate }} - {{ endDate }}</ion-text>
        </div>

        <div *ngIf="offer?.Description" class="offer-detail__disclaimer-text mb-200">
          <ion-text>{{ offer.Description }}</ion-text>
        </div>

        <div *ngIf="offer?.DisclaimerText" class="offer-detail__disclaimer-text">
          <ion-text>{{ offer.DisclaimerText }}</ion-text>
        </div>

        <mag-deal-button-container [offer]="offer" *ngIf="isCoupon && offer?.CanLoad"></mag-deal-button-container>

        <div class="offer-detail__participating-products">
          <mag-deal-participating-products
            [upcs]="conditionUpcs"
            [isBundle]="isBundle"
          ></mag-deal-participating-products>
        </div>
        <widget-layout
          type="offer"
          [objectId]="'offer/' + offerCode"
          [slug]="router.url"
          zoneName="Bottom"
        ></widget-layout>
      </div>
    </ng-template>
  </ng-container>
</ion-content>
