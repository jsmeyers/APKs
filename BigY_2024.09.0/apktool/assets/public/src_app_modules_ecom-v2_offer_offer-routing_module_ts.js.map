<widget-layout
  *ngIf="loaded"
  type="coupon"
  [objectId]="'coupon/' + couponCode"
  [slug]="router.url"
  zoneName="Sticky"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="coupon"
  [objectId]="'coupon/' + couponCode"
  [slug]="router.url"
  zoneName="Fixed Top"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="coupon"
  [objectId]="'coupon/' + couponCode"
  [slug]="router.url"
  zoneName="Fixed Center"
></widget-layout>

<app-header [isSimpleHeader]="true" [isShowBackButton]="true">
  <ion-title class="title-header">Coupon Details</ion-title>
</app-header>

<ion-content class="ion-padding">
  <ng-container *ngIf="!loaded">
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </ng-container>
  <ng-container *ngIf="loaded">
    <ng-container *ngIf="!coupon; else couponDetail">
      <page-not-found></page-not-found>
    </ng-container>
    <ng-template #couponDetail>
      <div class="coupons-detail" *ngIf="coupon">
        <widget-layout
          type="coupon"
          [objectId]="'coupon/' + couponCode"
          [slug]="router.url"
          zoneName="Top"
        ></widget-layout>
        <div class="coupons-detail__img" *ngIf="coupon?.ImageURL; else img_default">
          <mag-img [src]="coupon?.ImageURL"></mag-img>
        </div>
        <ng-template #img_default>
          <div class="coupons-detail__default-img">
            <mag-img src></mag-img>
          </div>
        </ng-template>

        <div *ngIf="coupon?.Title" class="coupons-detail__display-name mb-200">
          <ion-text>{{ coupon.Title }}</ion-text>
        </div>

        <div *ngIf="coupon?.Description" class="coupons-detail__description mb-200">
          <ion-text>{{ coupon.Description }}</ion-text>
        </div>

        <div *ngIf="couponExpirationDate" class="coupons-detail__expiration-date mb-200">
          <ion-text>Expires: {{ couponExpirationDate }}</ion-text>
          <mag-deal-expire-badge [expirationDate]="coupon?.ExpireDate"></mag-deal-expire-badge>
        </div>

        <div *ngIf="startDate && endDate" class="coupons-detail__valid-date mb-200">
          <ion-text>Valid: {{ startDate }} - {{ endDate }}</ion-text>
        </div>

        <div *ngIf="coupon?.Description" class="coupons-detail__disclaimer-text mb-200">
          <ion-text>{{ coupon.Description }}</ion-text>
        </div>

        <div *ngIf="coupon?.DisclaimerText" class="coupons-detail__disclaimer-text">
          <ion-text>{{ coupon.DisclaimerText }}</ion-text>
        </div>

        <mag-deal-button-container [offer]="coupon"></mag-deal-button-container>

        <div class="coupons-detail__participating-products" *ngIf="isLoadedParticipatingProducts">
          <mag-deal-participating-products
            [upcs]="conditionUpcs"
            [isBundle]="isBundle"
          ></mag-deal-participating-products>
        </div>
        <widget-layout
          type="coupon"
          [objectId]="'coupon/' + couponCode"
          [slug]="router.url"
          zoneName="Bottom"
        ></widget-layout>
      </div>
    </ng-template>
  </ng-container>
</ion-content>
