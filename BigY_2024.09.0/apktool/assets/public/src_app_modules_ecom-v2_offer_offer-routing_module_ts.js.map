<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<app-header [isSimpleHeader]="true" [isShowBackButton]="true">
  <ion-title class="title-header">Deals Details</ion-title>
</app-header>

<ion-content class="ion-padding">
  <div *ngIf="isLoading" class="center-page">
    <ion-spinner name="circles"></ion-spinner>
  </div>
  <div *ngIf="!isLoading">
    <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
    <div class="offer-detail" *ngIf="reward; else noReward">
      <div class="offer-detail__img" *ngIf="reward?.ImageUrl">
        <mag-img *ngIf="reward?.ImageTagUrl" class="offer-detail__img-tag" [src]="reward?.ImageTagUrl"></mag-img>
        <mag-img [src]="reward?.ImageUrl" ratio="square"></mag-img>
      </div>

      <div class="offer-detail__default-img" *ngIf="!reward?.ImageUrl">
        <mag-img src></mag-img>
      </div>

      <ng-container *ngIf="reward?.ClipPoint; else rewardClaimPoint">
        <div class="offer-detail__display-name mb-200">
          <ion-text>Free with {{ reward.ClipPoint }} points</ion-text>
        </div>
      </ng-container>

      <ng-template #rewardClaimPoint>
        <div *ngIf="reward?.ClippedInfo?.ClippedValueDisplay" class="offer-detail__display-name mb-200">
          <ion-text>{{ reward?.ClippedInfo?.ClippedValueDisplay }} {{ labelArr?.clipped_balance_type }}</ion-text>
        </div>
      </ng-template>

      <div *ngIf="reward?.Name" class="offer-detail__description mb-200">
        <ion-text>{{ reward.Name }}</ion-text>
      </div>

      <div *ngIf="offerExpirationDate" class="offer-detail__expiration-date mb-200">
        <ion-text>Expires: {{ offerExpirationDate }}</ion-text>
        <mag-deal-expire-badge [expirationDate]="reward?.ExpirationEndDate"></mag-deal-expire-badge>
      </div>

      <div *ngIf="startDate && endDate" class="offer-detail__valid-date mb-200">
        <ion-text>Valid: {{ startDate }} - {{ endDate }}</ion-text>
      </div>

      <div *ngIf="reward?.Description" class="offer-detail__disclaimer-text mb-200">
        <ion-text>{{ reward.Description }}</ion-text>
      </div>

      <mag-deal-button-container
        [offer]="reward"
        [type]="'reward'"
        [isLoaded]="!!clippedRewardId"
      ></mag-deal-button-container>

      <div class="offer-detail__participating-products" *ngIf="isLoadedParticipatingProducts">
        <mag-deal-participating-products [upcs]="conditionUpcs" [isBundle]="isBundle"></mag-deal-participating-products>
      </div>
    </div>
    <ng-template #noReward>
      <div>Reward not found</div>
    </ng-template>
    <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
  </div>
</ion-content>
