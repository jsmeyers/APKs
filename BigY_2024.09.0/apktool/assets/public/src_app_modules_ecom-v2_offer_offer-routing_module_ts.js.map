<widget-layout *ngIf="loaded" type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout *ngIf="loaded" type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout *ngIf="loaded" type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>
<app-header [isSimpleHeader]="true" *ngIf="dealSupport">
  <div class="header-simple__container">
    <mag-deal-search-box />
  </div>
</app-header>
<ion-content>
  <ng-container *ngIf="!dealSupport; else deal_support">
    <ion-img class="img" src="assets/imgs/404.svg"></ion-img>
  </ng-container>
  <ng-template #deal_support>
    <mag-deal-tabs
      *ngIf="settingsTabItems && settingsTabItems.length > 0"
      [data]="settingsTabItems"
      (tabChange)="selectTab($event)"
      [defaultTab]="activeTab"
    ></mag-deal-tabs>
    <ion-tabs class="content-deals-page">
      <ion-tab-bar slot="top">
        <ion-tab-button tab="offers"> </ion-tab-button>
        <ion-tab-button tab="rewards"> </ion-tab-button>
        <ion-tab-button tab="loaded-savings"> </ion-tab-button>
        <ion-tab-button tab="coupons"> </ion-tab-button>
      </ion-tab-bar>
    </ion-tabs>
  </ng-template>
</ion-content>
