<ion-header>
  <ion-toolbar class="ion-no-line">
    <ion-title>Enter a ZIP Code</ion-title>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="tutorial" text="" icon="md-arrow-back" color="dark"></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
  <div class="zipcode-container">
    <ion-input
      [ngClass]="{ 'input-error': cZip?.errors?.pattern ? true : false }"
      label="ZIP Code"
      type="tel"
      maxlength="5"
      [pattern]="RegularExpression.ZipPattern"
      label-placement="floating"
      [(ngModel)]="zipCode"
      #cZip="ngModel"
    ></ion-input>
    <p class="error" *ngIf="cZip?.errors?.pattern && cZip?.touched">Please enter a valid ZIP Code</p>
  </div>
  <div class="actions">
    <ion-button class="find-store">Find And Set My Store</ion-button>
    <ion-button class="current-location">Use Current Location</ion-button>
  </div>
</ion-content>
