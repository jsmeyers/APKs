<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<ion-header>
  <ion-toolbar class="ion-no-line">
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="closeTutorial()">
        <ion-img slot="icon-only" src="assets/icon/close-modal-ico.svg"></ion-img>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<!-- Zooming Mode -->
<ion-modal
  *ngIf="currentImage"
  [isOpen]="isViewerOpen"
  [showBackdrop]="false"
  [backdropDismiss]="false"
  (didDismiss)="closeViewer()"
  class="tutorial-viewer"
>
  <ng-template>
    <ion-header class="tutorial-viewer__header">
      <ion-toolbar>
        <ion-title class="tutorial-viewer__title"> {{ 'tutorial.title' | translate }} </ion-title>
        <ion-buttons slot="end">
          <ion-button (click)="closeViewer()">
            <span class="tutorial-viewer__btn-close"> {{ 'tutorial.btnDone' | translate }} </span>
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content class="tutorial-viewer__content" fullscreen scroll-y="false">
      <swiper-container [attr.initial-slide]="initialSlideIndex" class="tutorial-viewer__swiper">
        <swiper-slide *ngFor="let slide of tutorialList" class="tutorial-viewer__slide">
          <img
            class="tutorial-viewer__image"
            [src]="slide?.imageUrl"
            alt="{{ slide?.title }}"
            *ngIf="slide?.imageUrl"
            appHammerZoomable
          />
        </swiper-slide>
      </swiper-container>
    </ion-content>
  </ng-template>
</ion-modal>

<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
<!-- First Slide -->
<ion-content *ngIf="!isStartTour">
  <div class="first-tour" *ngIf="firstTour">
    <div class="title-container">
      <h1 [innerHTML]="firstTour?.title" class="ion-text-center"></h1>
    </div>
    <div class="image-container" *ngIf="firstTour?.imageUrl">
      <button type="button" (click)="openViewer(0)">
        <img [src]="firstTour?.imageUrl" alt="{{ firstTour?.title }}" />
      </button>
    </div>
    <span [innerHTML]="firstTour?.description" class="ion-no-margin primary"></span>
    <div class="footer">
      <ion-button (click)="startTour()">
        <span class="btn-text-with-icon">
          {{ 'tutorial.btnNext' | translate }}
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </span>
      </ion-button>
    </div>
  </div>
</ion-content>

<!-- Slides tour -->
<ion-content *ngIf="isStartTour">
  <div class="slides-wrapper">
    <swiper-container (swiperslidechange)="slideChanged($event)" pagination="true">
      <swiper-slide
        *ngFor="let slide of swiperSlides; let i = index"
        tabindex="0"
        aria-label="Slide {{ i + 1 }} of {{ slide?.title }}"
      >
        <div class="slide-content">
          <div class="title-container">
            <h1 [innerHTML]="slide?.title" class="ion-text-center"></h1>
          </div>
          <div class="image-container">
            <button type="button" (click)="openViewer(i + 1)">
              <img [src]="slide?.imageUrl" alt="{{ slide?.title }}" />
            </button>
          </div>
          <span [innerHTML]="slide?.description" class="ion-no-margin primary"></span>
        </div>
      </swiper-slide>
    </swiper-container>
  </div>
</ion-content>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
