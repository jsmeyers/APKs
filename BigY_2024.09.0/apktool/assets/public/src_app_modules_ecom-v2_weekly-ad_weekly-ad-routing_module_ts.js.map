<widget-layout *ngIf="loadedWidget" type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout *ngIf="loadedWidget" type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout
  *ngIf="loadedWidget"
  type="page"
  [objectId]=""
  [slug]="router.url"
  zoneName="Fixed Center"
></widget-layout>
<app-header [isSimpleHeader]="true">
  <ion-title class="title-header">{{ 'header.weeklyAd' | translate }}</ion-title>
</app-header>
<ion-content [ngClass]="{ loading: loadingSkeleton }">
  <ng-container *ngIf="!enabledPage">
    <div class="container">
      <div class="not-found">
        <ion-img class="not-found__image" src="assets/imgs/404.svg"></ion-img>
        <p class="not-found__title">{{ 'common.notFoundTitle' | translate }}</p>
        <p class="not-found__description">{{ 'common.notFoundDescription' | translate }}</p>
      </div>
    </div>
  </ng-container>
  <ng-container *ngIf="enabledPage">
    <div class="banner" *ngIf="enabledSubscribeBanner">
      <mag-subscribe-now></mag-subscribe-now>
    </div>
    <mag-tabs
      *ngIf="dataTabs?.length > 1"
      mode="scale"
      [activeItem]="activeTab"
      [defaultId]="activeTab?.id"
      [data]="dataTabs"
      (selectTab)="selectedChanged($event)"
    ></mag-tabs>
    <div *ngIf="loadingSkeleton" class="skeleton">
      <div class="skeleton-banner"></div>
      <div class="skeleton-grid">
        <div class="skeleton-product" *ngFor="let item of [1, 2, 3, 4]"></div>
      </div>
    </div>
    <div *ngIf="loaded" class="container" #container>
      <div class="widget-layout" *ngIf="loadedWidget">
        <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
      </div>
      <ng-container *ngIf="dataTabs?.length">
        <ng-container [ngSwitch]="activeTab?.id">
          <weekly-flyer-view *ngSwitchCase="'flyer-view'"></weekly-flyer-view>
          <weekly-product-view *ngSwitchCase="'product-view'"></weekly-product-view>
          <weekly-all-ads *ngSwitchCase="'all-ads'"></weekly-all-ads>
        </ng-container>
      </ng-container>
      <ng-container *ngIf="!dataTabs?.length">
        <weekly-flyer-view></weekly-flyer-view>
      </ng-container>
      <div class="widget-layout" *ngIf="loadedWidget">
        <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
      </div>
    </div>
  </ng-container>
</ion-content>
