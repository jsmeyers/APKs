<ion-content class="maintenance">
  <ng-container *ngIf="!isShowUIBigY; else bigyTpl">
    <div class="maintenance__content">
      <p class="maintenance__title">Our site is under maintenance</p>
      <p class="maintenance__desc">
        We are working on making better experiences for you. We should be back shortly. Thank you for your patience.
      </p>
      <ion-img class="maintenance__image" src="assets/imgs/maintenance.png" alt="App maintenance illustration">
      </ion-img>
    </div>
  </ng-container>

  <ng-template #bigyTpl>
    <div class="maintenance__content--special">
      <ion-img
        class="maintenance__image"
        src="assets/imgs/maintenanceBigY.png"
        alt="Big Y app maintenance illustration"
      >
      </ion-img>
      <p class="maintenance__title--special">Please check back soon!</p>
      <p class="maintenance__desc--special">We’re making a few updates to improve your experience.</p>
    </div>
  </ng-template>
</ion-content>
