<widget-layout type="home" objectId="home" [slug]="this.router.url" zoneName="Sticky"> </widget-layout>
<widget-layout type="home" objectId="home" [slug]="this.router.url" zoneName="Fixed Top"> </widget-layout>
<widget-layout type="home" objectId="home" [slug]="this.router.url" zoneName="Fixed Center"> </widget-layout>

<app-header></app-header>
<ion-content class="outer-content">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($event)">
    <ion-refresher-content
      pullingIcon="arrow-down"
      pullingText="Pull to refresh"
      refreshingSpinner="circles"
      refreshingText="Refreshing..."
    >
    </ion-refresher-content>
  </ion-refresher>
  <home-skeleton [timeout]="1000"></home-skeleton>
  <ion-grid class="home-menu ion-no-padding">
    <ng-container>
      <!-- pickup order-->
      <ion-row class="item-widget" *ngIf="currentUser">
        <ion-col size="12">
          <pickup-widget></pickup-widget>
        </ion-col>
      </ion-row>
      <!-- end pickup order -->
      <ion-row class="item-widget">
        <ion-col size="12">
          <widget-layout type="home" objectId="home" [slug]="this.router.url" zoneName="Top"> </widget-layout>
        </ion-col>
      </ion-row>
      <ion-row class="item-widget">
        <ion-col size="12">
          <widget-layout type="home" objectId="home" [slug]="this.router.url" zoneName="Bottom"> </widget-layout>
        </ion-col>
      </ion-row>
    </ng-container>
  </ion-grid>
</ion-content>

<mag-app-dialog #dialogThanksModal>
  <mag-content-block-modal
    [title]="'notification.signUpSubscriptionThanks.title' | translate"
    [description]="'notification.signUpSubscriptionThanks.description' | translate"
    [primaryButtonText]="'notification.signUpSubscriptionThanks.primaryButtonText' | translate"
    variant="success"
    iconType="checkmark"
    (primaryAction)="onNavigateWeeklyAds()"
    (closeAction)="onCloseModalThanksSubscribing()"
  ></mag-content-block-modal>
</mag-app-dialog>

<mag-app-dialog #dialogCheckPhoneModal>
  <mag-content-block-modal
    [title]="'notification.signUpSubscriptionPhone.title' | translate"
    [description]="'notification.signUpSubscriptionPhone.description' | translate"
    [primaryButtonText]="'notification.signUpSubscriptionPhone.primaryButtonText' | translate"
    variant="warning"
    iconType="phone"
    (primaryAction)="onCloseModalCheckPhone()"
    (closeAction)="onCloseModalCheckPhone()"
  ></mag-content-block-modal>
</mag-app-dialog>
