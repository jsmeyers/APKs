<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<app-header [isOnlySearchHeader]="true" [isShowBackButton]="true"></app-header>

<ion-content class="all-categories">
  <div class="all-categories__container">
    <ng-container *ngIf="categories && categories.length > 0; else elseBlock">
      <div class="all-categories__list list">
        <widget-layout type="page" objectId="" [slug]="router.url" zoneName="Top"></widget-layout>
        <ng-container *ngFor="let category of categories">
          <button
            (click)="navigateSpecificCategory(category.Code, categoryService.getNameOfCategory(category))"
            class="list__item item"
          >
            <div class="item__text">{{ categoryService.getNameOfCategory(category) }}</div>
            <div class="item__cta">
              <ion-icon name="chevron-forward-outline"></ion-icon>
            </div>
          </button>
        </ng-container>
        <widget-layout type="page" objectId="" [slug]="router.url" zoneName="Bottom"></widget-layout>
      </div>
    </ng-container>
    <ng-template #elseBlock>
      <div class="all-categories__list list">
        <ng-container *ngFor="let skeletonCategory of skeletonCategories">
          <div animated class="list__item item">
            <ion-skeleton-text animated class="item__skeleton"> </ion-skeleton-text>
          </div>
        </ng-container>
      </div>
    </ng-template>
  </div>
</ion-content>
