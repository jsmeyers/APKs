<div class="categories-swiper">
  <ng-container *ngIf="category?.SubCategories?.length">
    <swiper-container
      #swiper
      class="categories-swiper__slides swiper-container"
      [slidesPerView]="slidesPerView"
      [spaceBetween]="spaceBetween"
    >
      <swiper-slide *ngFor="let cat of category?.SubCategories" class="swiper__slide slide">
        <button
          (click)="navigateSpecificCategory(cat.Code, categoryService.getNameOfCategory(cat))"
          class="slide__item item"
        >
          <div class="item__img-wrapper">
            <mag-img (ionError)="onErrorImage($event)" class="item__image-content" [src]="cat.ImageUrl" alt="image" />
          </div>
          <div class="item__text">{{ categoryService.getNameOfCategory(cat) }}</div>
        </button>
      </swiper-slide>
    </swiper-container>
  </ng-container>
</div>
