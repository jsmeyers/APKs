<ion-grid class="recommend-selection">
  <div class="recommend-selection__title">For you</div>
  <ion-row class="recommend-selection__wrapper wrapper">
    <button class="wrapper__element">
      <ion-icon src="../../../../../assets/icon/shopping-cart-reorder.svg"></ion-icon>
      <div class="wrapper__text">Reorder</div>
    </button>
    <button class="wrapper__element">
      <ion-icon src="../../../../../assets/icon/scissors-outline.svg"></ion-icon>
      <div class="wrapper__text">Rewards!</div>
    </button>
    <button class="wrapper__element">
      <ion-icon src="../../../../../assets/icon/save-money.svg"></ion-icon>
      <div class="wrapper__text">On Sale</div>
    </button>
    <button class="wrapper__element">
      <ion-icon src="../../../../../assets/icon/scissors-outline.svg"></ion-icon>
      <div class="wrapper__text">Coupons</div>
    </button>
  </ion-row>
</ion-grid>
