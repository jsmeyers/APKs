<div class="shop-by-category container">
  <div class="container__top top">
    <div class="top__title">{{ 'browse.titleDepartment' | translate }}</div>
    <div>
      <button class="top__cta" (click)="viewAllCategories()">{{ 'common.viewAll' | translate }}</button>
    </div>
  </div>

  <div
    [ngClass]="{
      'container__grid grid': !departmentLoaded || (departments && departments.length > 0),
      'container__grid--no-data': !departments && departmentLoaded,
    }"
  >
    @if (departments && departments.length > 0) {
      <button
        *ngFor="let item of departments; index as i"
        (click)="navigateSpecificCategory(item.CategoryCode, categoryService.getNameOfCategory(item))"
        class="grid__item item"
      >
        <div class="item__image-container loaded" *ngIf="item?.ImageUrl">
          <ion-img class="item__image-content" [src]="item.ImageUrl" alt="image" />
        </div>
        <div class="item__image-container loaded" *ngIf="!item?.ImageUrl">
          <div [innerHTML]="magImg | safeHtml"></div>
        </div>
        <div class="item__content">
          <div class="item__content-text">{{ categoryService.getNameOfCategory(item) }}</div>
        </div>
      </button>
    } @else if (departmentLoaded === true) {
      <div class="grid__no-data">
        <div class="no-data__title">{{ 'common.noPopularCatAvailable.title' | translate }}</div>
        <div class="no-data">{{ 'common.noPopularCatAvailable.message' | translate }}</div>
      </div>
    } @else {
      <button class="grid__item item skeleton" *ngFor="let item of skeletonCategories">
        <ion-skeleton-text animated class="item__image-container loaded"></ion-skeleton-text>
        <ion-skeleton-text animated class="item__content loaded"></ion-skeleton-text>
      </button>
    }
  </div>
</div>
