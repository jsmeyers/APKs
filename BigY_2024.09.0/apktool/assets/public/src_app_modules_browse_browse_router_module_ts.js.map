<widget-layout
  *ngIf="loaded"
  type="category"
  [objectId]="'category/' + catCode"
  [slug]="router.url"
  zoneName="Sticky"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="category"
  [objectId]="'category/' + catCode"
  [slug]="router.url"
  zoneName="Fixed Top"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="category"
  [objectId]="'category/' + catCode"
  [slug]="router.url"
  zoneName="Fixed Center"
></widget-layout>

<app-header [isSimpleHeader]="true">
  <div class="header-simple__container">
    <app-search [isLocalSearch]="false" [isShowBackButton]="true"></app-search>
  </div>
</app-header>
<ion-content class="category">
  <ng-container *ngIf="!loaded; else loadedContent">
    <div class="loading-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </ng-container>
  <ng-template #loadedContent>
    <div class="widget-layout">
      <widget-layout
        type="category"
        [objectId]="'category/' + catCode"
        [slug]="router.url"
        zoneName="Top"
      ></widget-layout>
    </div>
    <ng-container *ngIf="title">
      <div class="category__container container">
        <div class="container__wrapper wrapper">
          <div class="wrapper__title">{{ title }}</div>
          <ng-container *ngIf="category?.SubCategories?.length >= MINIMUM_NUMBER_CATEGORY">
            <app-categories-swiper
              [category]="category"
              [spaceBetween]="24"
              [disable]="disableCategory"
            ></app-categories-swiper>
          </ng-container>
        </div>
      </div>
    </ng-container>
    <div class="wrapper__department-search">
      <mag-search-container
        [isDepartment]="isDepartment"
        view-mode="mobile"
        [keyword]="keyword"
        [queryParams]="queryParamsString"
        (onContentLoaded)="onContentLoaded()"
      ></mag-search-container>
    </div>
    <div class="widget-layout">
      <widget-layout
        type="category"
        [objectId]="'category/' + catCode"
        [slug]="router.url"
        zoneName="Bottom"
      ></widget-layout>
    </div>
  </ng-template>
</ion-content>
