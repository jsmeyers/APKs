<div class="dxpage-custom-layout__wrapper" [ngStyle]="wrapperStyles" *ngIf="trackedZoneData">
  <ng-container
    *ngTemplateOutlet="renderZone; context: { zoneData: trackedZoneData, isFirstZone: true }"
  ></ng-container>
</div>

<ng-template #renderZone let-zoneData="zoneData" let-isFirstZone="isFirstZone">
  <ng-container>
    <div class="dxpage-custom-layout__zone" [ngClass]="getClassNames(zoneData?.ClassNames, isFirstZone)">
      <ng-container *ngFor="let item of zoneData?.ContentItems">
        <mag-dxpages-content-item
          [headline]="item?.ContentItemName"
          [contentType]="item?.ContentType"
          [dataSources]="item?.DataSources"
          [thumbnail]="item?.Thumbnail"
          [fallback]="item?.Fallback"
          [trackInfo]="item?.extendedTrackInfo"
          [ngStyle]="{ padding: getItemPadding(zoneData) }"
        ></mag-dxpages-content-item>
      </ng-container>

      <ng-container *ngFor="let child of zoneData?.Children">
        <ng-container *ngTemplateOutlet="renderZone; context: { zoneData: child, isFirstZone: false }"></ng-container>
      </ng-container>
    </div>
  </ng-container>
</ng-template>
