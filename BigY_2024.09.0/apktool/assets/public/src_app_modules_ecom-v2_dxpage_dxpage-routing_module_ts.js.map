<ng-container *ngIf="pages?.length">
  <div class="dxpage-vertical-view__wrapper">
    <dxpage-custom-layout
      *ngFor="let page of pages; let index = index"
      id="dxpage-vertical-{{ index + 1 }}"
      [layoutConfig]="page.LayoutConfig"
      [trackInfo]="trackInfoList[index]"
    >
    </dxpage-custom-layout>
  </div>
</ng-container>
