<div
  class="product-content-collapse__des-content"
  [ngClass]="{ 'product-content-collapse__des-content--blur': isReadMore && !hideReadMore }"
>
  <div *ngIf="content?.length">
    <span *ngIf="title">{{ title }}: </span>
    <ion-text [ngClass]="contentClass" [innerHTML]="content | safeHtml"></ion-text>
  </div>
</div>
<button *ngIf="!hideReadMore" class="product-content-collapse__read-more" (click)="changeDesView()">
  {{ isReadMore ? ('productDetail.readMore' | translate) : ('productDetail.readLess' | translate) }}
</button>
