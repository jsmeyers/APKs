<widget-layout type="endcap" [objectId]="objectId" [slug]="this.router.url" zoneName="Sticky"> </widget-layout>

      <ion-back-button defaultHref="/tabs/home" text="" icon="md-arrow-back" color="dark"></ion-back-button>

  </ion-toolbar>
</ion-header>
<ion-content>
  <widget-layout type="endcap" [objectId]="objectId" [slug]="this.router.url" zoneName="Top"> </widget-layout>
