<ng-container *ngIf="photos$ | async as photos">
  <!-- Only render photo-container if there are photos or imageRenderedUrl is present -->
  <div class="photo-container" *ngIf="photos?.length > 0 || imageRenderedUrl">
    <!-- Case 1: Render all photos if photos exist and imageRenderedUrl is NOT present -->
    <ng-container *ngIf="photos?.length > 0 && !imageRenderedUrl">
      <custom-img
        *ngFor="let photo of photos"
        class="photo"
        [src]="photo.imageUrl"
        [isFit]="true"
        [displayDefaultImage]="false"
        [styles]="{ 'max-width': '100%' }"
        [style.zIndex]="photo.zIndex"
        objectFit="contain"
        imgSize="height_450"
      ></custom-img>
    </ng-container>

    <!-- Case 2: Render imageRenderedUrl if photos are empty -->
    <ng-container *ngIf="photos?.length === 0 && imageRenderedUrl">
      <dxp-img
        class="photo"
        [src]="imageRenderedUrl"
        [isFit]="true"
        [displayDefaultImage]="false"
        [styles]="{ 'max-width': '100%' }"
        [style.zIndex]="999"
        objectFit="contain"
        imgSize="height_450"
      ></dxp-img>
    </ng-container>
  </div>

  <!-- Case 3: Show 'magImg' if no photos and no imageRenderedUrl -->
  <div *ngIf="photos?.length === 0 && !imageRenderedUrl" class="default-img" [innerHTML]="magImg | safeHtml"></div>
</ng-container>
