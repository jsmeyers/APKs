<widget-layout
  *ngIf="loaded"
  type="search-product"
  [objectId]="'search-product/' + keyword"
  [slug]="slug"
  zoneName="Sticky"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="search-product"
  [objectId]="'search-product/' + keyword"
  [slug]="slug"
  zoneName="Fixed Top"
></widget-layout>
<widget-layout
  *ngIf="loaded"
  type="search-product"
  [objectId]="'search-product/' + keyword"
  [slug]="slug"
  zoneName="Fixed Center"
></widget-layout>

<app-header [isSimpleHeader]="true">
  <div class="header-simple__container">
    <app-search [isLocalSearch]="false" [isShowBackButton]="true"></app-search>
  </div>
</app-header>
<ion-content>
  <div class="widget-layout" *ngIf="loaded">
    <widget-layout
      type="search-product"
      [objectId]="'search-product/' + keyword"
      [slug]="slug"
      zoneName="Top"
    ></widget-layout>
  </div>

  <!-- <div class="mag-product-search-list" [innerHTML]="magProductSearchList | safeHtml"></div> -->
  <div class="mag-product-search-list" *ngIf="loaded">
    <mag-search-container [keyword]="keywordClone" [queryParams]="queryParams" class="hydrated"></mag-search-container>
  </div>
  <div class="widget-layout" *ngIf="loaded">
    <widget-layout
      type="search-product"
      [objectId]="'search-product/' + keyword"
      [slug]="slug"
      zoneName="Bottom"
    ></widget-layout>
  </div>
</ion-content>
