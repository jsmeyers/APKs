<div class="product-parity">
  <div class="product-parity__title">{{ parityName }}</div>
  <div class="product-parity__product-list">
    <div></div>
    <div
      *ngFor="let product of isExpand ? listProduct : listProduct.slice(0, 1); let index = index"
      [ngClass]="{
        'product-parity__product-item': true,
        'product-parity__product-item--selected': selectedProduct.id === product.id,
        'product-parity__product-item--first': index === 0,
      }"
    >
      <ion-button fill="clear" class="product-parity__img">
        <ion-img [src]="product.imageUrl"></ion-img>
      </ion-button>
      <ion-button fill="clear" class="product-parity__informations" (click)="onSelectProduct(product)">
        <div class="product-parity__image-name">{{ product?.imageName }}</div>
        <div class="product-parity__name">{{ product?.name }}</div>
        <div class="product-parity__price">{{ product?.price }}</div>
      </ion-button>
      <ion-button
        fill="clear"
        class="product-parity__dropdow-icon"
        *ngIf="index === 0"
        (click)="onClickDropdowIcon($event)"
      >
        <ion-icon name="chevron-down-outline" *ngIf="!isExpand"></ion-icon>
        <ion-icon name="chevron-up-outline" *ngIf="isExpand"></ion-icon>
      </ion-button>
    </div>
  </div>
</div>
