<div class="product-parity">
  <div class="product-parity__name">{{ parityName }} ({{ listFormattedProduct?.length }} Available)</div>
  <div class="product-parity__slides-wrapper">
    <swiper-container class="product-parity__container" [slidesPerView]="slidesPreView" [spaceBetween]="16">
      <swiper-slide *ngFor="let product of listFormattedProduct">
        <button
          [ngClass]="{
            'product-parity__item': true,
            'product-parity__item--selected': selectedProduct.Id === product.Id,
          }"
          (click)="onSelectProduct(product)"
        >
          <div class="product-parity__img" *ngIf="product?.MediaAssets?.Images[0]?.ImgUrlOriginal">
            <ion-img [src]="product.MediaAssets.Images[0].ImgUrlOriginal"></ion-img>
          </div>
          <div class="product-parity__default-img" *ngIf="!product?.MediaAssets?.Images[0]?.ImgUrlOriginal">
            <div [innerHTML]="magImg | safeHtml"></div>
          </div>
          <div class="product-parity__title">
            <ion-text>{{ product?.DisplayName?.En || product?.Name?.En }}</ion-text>
          </div>
          <div class="product-parity__sizing">
            <ion-text
              >{{ product?.Unit }}
              <span *ngIf="product?.PricePerUnitItem">({{ product?.PricePerUnitItem }})</span>
            </ion-text>
          </div>
          <div class="product-parity__price">
            <ion-text *ngIf="product.DisplaySalePrice">
              <span class="product-detail__sale-price">
                {{ product?.DisplaySalePrice }} {{ product?.DisplayPricingUnit }}
              </span>
            </ion-text>
            <ion-text *ngIf="!product.DisplaySalePrice">
              {{ product?.DisplayPrice }} {{ product?.DisplayPricingUnit }}
            </ion-text>
          </div>
        </button>
      </swiper-slide>
    </swiper-container>
  </div>
</div>
