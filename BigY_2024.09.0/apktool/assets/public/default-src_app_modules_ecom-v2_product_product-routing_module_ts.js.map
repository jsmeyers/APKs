<div class="option">
  <div class="option__title">{{ productOptions?.DisplayName?.En }}</div>
  <div class="option__condition">{{ productOptions?.IsRequired ? 'Required' : 'Optional' }}</div>

  <ng-container *ngIf="productOptions?.DisplayType === 'radio' && productOptions?.Options?.[0]?.IconUrl">
    <div
      class="color-radio"
      tabindex="0"
      *ngFor="let option of productOptions?.Options"
      (click)="selectOption(option)"
      (keydown)="selectOption(option)"
      [ngStyle]="{ 'background-image': 'url(' + option?.IconUrl + ')' }"
      [ngClass]="{ 'color-active': selectedOptions[0]?.Id === option?.Id }"
    ></div>
  </ng-container>

  <ng-container *ngIf="productOptions?.DisplayType === 'radio' && !productOptions?.Options?.[0]?.IconUrl">
    <div class="option__list" *ngIf="productOptions?.Options">
      <div
        tabindex="0"
        class="option__list-item"
        *ngFor="let option of productOptions?.Options"
        (click)="selectOption(option)"
        (keydown)="selectOption(option)"
      >
        <div
          class="option__single-check"
          [ngClass]="{ 'option__single-check--selected': selectedOptions[0]?.Id === option?.Id }"
        >
          <div *ngIf="selectedOptions[0]?.Id === option?.Id" class="option__single-check--checked"></div>
        </div>

        <div class="option__name">{{ option?.DisplayName?.En }}</div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="productOptions?.DisplayType === 'checkbox'">
    <div class="option__list" *ngIf="productOptions?.Options">
      <div
        tabindex="0"
        class="option__list-item"
        *ngFor="let option of productOptions?.Options"
        (click)="selectOption(option)"
        (keydown)="selectOption(option)"
      >
        <div class="option__multi-check" *ngIf="productOptions?.DisplayType === 'checkbox'">
          <ion-checkbox checked="{{ detectCheckBox(option?.Id) }}"></ion-checkbox>
        </div>
        <div class="option__name">{{ option?.DisplayName?.En }}</div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="productOptions?.DisplayType === 'select'">
    <div class="option__list">
      <ion-select
        interface="popover"
        [value]="productOptions?.SelectedOptionValue"
        [interfaceOptions]="{ cssClass: 'popover-product-options' }"
        (ionChange)="selectOption(productOptions, $event?.detail?.value)"
        (click)="ionSelectOptionFocus()"
      >
        >
        <ion-select-option *ngFor="let option of productOptions?.Options" [value]="option?.Id">
          {{ option?.DisplayName?.En }}
        </ion-select-option>
      </ion-select>
    </div>
  </ng-container>

  <ng-container *ngIf="productOptions?.DisplayType === 'input'">
    <div class="option__list">
      <textarea
        class="option__message"
        [ngModel]="productOptions?.SelectedOptionValue"
        (ngModelChange)="hanldeChangeMesage($event, productOptions)"
        maxlength="50"
      ></textarea>

      <div class="option__message-condition">
        <ion-text> Maximum of 50 characters </ion-text>
      </div>
    </div>
  </ng-container>
</div>
