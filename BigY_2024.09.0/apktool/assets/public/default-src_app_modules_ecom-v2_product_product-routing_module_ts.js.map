<ion-header class="product-modal__header">
  <div tabindex="0" class="product-modal__close-btn" (click)="closeModal()" (keydown)="closeModal()">
    <ion-img src="assets/icon/close-modal-ico.svg"></ion-img>
  </div>
  <div class="product-modal__title">{{ productName }}</div>
</ion-header>

<ion-content>
  <div class="product-modal__content">
    <custom-photos [photos$]="optionPhotos$" [imageRenderedUrl]="defaultImage"></custom-photos>

    <div *ngFor="let option of renderOptionSets" class="product-modal__option-selector">
      <product-options-selector
        [productOptions]="option"
        (handleChangeOption)="onChangeOption($event)"
      ></product-options-selector>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar class="product-modal__toolbar">
    <div class="product-modal__total-price">
      <div class="product-modal__total-price-text">Total</div>
      <div class="product-modal__total-price-value">{{ totalVal | currency: 'USD' : 'symbol' : '1.2-2' }}</div>
    </div>
    <div class="btn-add">
      <mag-product-cta
        [buttonViewMode]="btnMode"
        [selectedOptions]="submitOptions"
        [product]="rawProduct"
        [isEditOption]="isEdit"
        [productOptionInCartId]="cartItemId"
        [isFullWidth]="true"
      ></mag-product-cta>
    </div>
  </ion-toolbar>
</ion-footer>
