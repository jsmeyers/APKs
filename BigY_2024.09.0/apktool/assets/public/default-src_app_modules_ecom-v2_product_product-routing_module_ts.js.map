<div
  [ngClass]="{ container: isFit || isCover || isContain, 'full-width': isFullWidth, 'full-height': isFullHeight }"
  [ngStyle]="{ height: '100%', width: '100%' }"
>
  <ng-container *ngIf="!cached">
    <img
      *ngIf="!error"
      [ngStyle]="styles"
      [hidden]="!loaded"
      [src]="src"
      [alt]="alt"
      (load)="onLoad()"
      (error)="onError()"
      [ngClass]="{ fit: isFit, cover: isCover, contain: isContain }"
    />
    <div *ngIf="src && !loaded && !error" class="img-loading" [ngStyle]="styles"></div>
    <img
      *ngIf="!src || (src && error)"
      [ngStyle]="styles"
      [src]="default"
      [alt]="alt"
      [ngClass]="{ fit: isFit, cover: isCover, contain: isContain }"
    />
  </ng-container>

  <ng-container *ngIf="cached">
    <img
      *ngIf="!error"
      [ngStyle]="styles"
      [src]="src"
      [alt]="alt"
      (error)="onError()"
      [ngClass]="{ fit: isFit, cover: isCover, contain: isContain }"
    />
    <img
      *ngIf="default && error"
      [ngStyle]="styles"
      [src]="default"
      [alt]="alt"
      [ngClass]="{ fit: isFit, cover: isCover, contain: isContain }"
    />
  </ng-container>
</div>
