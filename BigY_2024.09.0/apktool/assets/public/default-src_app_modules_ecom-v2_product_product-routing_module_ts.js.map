<ng-container *ngIf="renderPriceList">
  <div class="price-list__title" *ngIf="renderPriceList?.DisplayName?.En">{{ renderPriceList.DisplayName.En }}</div>
  <div class="price-list__cards" *ngIf="renderPriceList?.Options">
    <div *ngFor="let item of renderPriceList.Options; let i = index">
      <ion-button
        fill="clear"
        [ngClass]="{ 'price-list__card-item': true, 'price-list__card-item--selected': item?.Id === selectedPrice?.Id }"
        (click)="changePriceCard(item)"
      >
        <div class="price-list__wrapper">
          <div class="price-list__size" *ngIf="item?.DisplayName?.En">{{ item.DisplayName.En }}</div>
          <div class="price-list__est" *ngIf="item?.PriceModifier">
            Est. {{ item.PriceModifier | currency: 'USD' : 'symbol' : '1.2-2' }}
          </div>
        </div>
      </ion-button>
    </div>
  </div>
</ng-container>
