<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<ion-header>
  <ion-toolbar class="cus-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home" text="" icon="md-arrow-back" class="dark"></ion-back-button>
    </ion-buttons>
    <ion-title text-center>Contact Us</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <div class="text-content">
    <h2>We'd like to hear from you!</h2>
    Guest Services Hours: <br />
    Monday - Friday: 8 am - 5 pm <br />
    <br />

    <ion-item no-lines>
      <a href="tel:+1-855-762-7880">
        <button ion-button>1-855-762-7880</button>
      </a>
    </ion-item>

    <ion-item no-lines>
      <button ion-button>Email Us</button>
    </ion-item>
  </div>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>
