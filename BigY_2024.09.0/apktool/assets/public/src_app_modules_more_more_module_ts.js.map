<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>
<app-header [isSimpleHeader]="true" [isShowBackButton]="true" [isHideCartListIcons]="true">
  <ion-title class="title-header">{{ 'aboutPage.title' | translate }}</ion-title>
</app-header>
<ion-content scroll-y="false">
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <div class="about-page__container">
    <button (click)="goTutorial()">{{ 'aboutPage.whatNew' | translate }}</button>
    <button (click)="goAppSettings()">{{ 'aboutPage.appSetting' | translate }}</button>
  </div>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>

<ion-footer>
  <div class="about-page__version-info">
    {{ 'aboutPage.appVersion' | translate }} {{ info.version }} ({{ info.buildNumber }})
  </div>
</ion-footer>
