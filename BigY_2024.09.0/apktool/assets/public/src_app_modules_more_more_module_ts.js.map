<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home" text="" icon="md-arrow-back" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>Debug Log</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <ion-row *ngFor="let item of logs">
    <ion-col size="3"> {{ item.timeStamp.toLocaleString() }} </ion-col>
    <ion-col size="3"> {{ item.level }} </ion-col>
    <ion-col size="6"> {{ item.methodName }} </ion-col>
    <ion-col size="12">
      <ion-button size="small" (click)="sendMail(item)" fill="clear">compose</ion-button>
      <a *ngIf="item.mailContent" href="mailto:trang@relationshop.com?body={{ item.mailContent }}">send</a>
    </ion-col>
    <ion-col size="12" *ngIf="item.message.length > 1"> User: {{ item.message[1] }} </ion-col>
    <ion-col size="12"> {{ item.message[0] }} </ion-col>
  </ion-row>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>
