<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home" text="" icon="md-arrow-back" color="dark"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ 'header.more' | translate }}</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <ion-item detail="false" *ngIf="user" [routerLink]="['/tabs/more/message-center']">
    <ion-label class="cus-menuItemHeavy ion-text-left"> Messages </ion-label>
    <ion-note slot="end">
      <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
    </ion-note>
  </ion-item>
  <ng-container *ngFor="let nav of dynamicMenus">
    <ion-item detail="false" (click)="onClickDynamicMenu(nav)">
      <ion-label class="cus-menuItemHeavy ion-text-left"> {{ nav?.Label }} </ion-label>
      <ion-note slot="end">
        <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
      </ion-note>
    </ion-item>
  </ng-container>
  <ng-container *ngFor="let nav of dynamicNavs">
    <ion-item detail="false" [hidden]="!user" (click)="checkCustomServiceAvailableInstore(nav.ServiceId)">
      <ion-label class="cus-menuItemHeavy ion-text-left"> {{ nav?.Name }} </ion-label>
      <ion-note slot="end">
        <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
      </ion-note>
    </ion-item>
  </ng-container>
  <ng-container *ngIf="false">
    <ion-list class="cus-listButton">
      <ion-item detail="false" [hidden]="!user" [routerLink]="['/account']">
        <ion-label class="cus-menuItemHeavy ion-text-left"> My Account </ion-label>
        <ion-note slot="end">
          <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
        </ion-note>
      </ion-item>
      <!-- <ion-item detail="false" [routerLink]="['/tabs/weekly-ad/flyer']">
        <ion-label class="cus-menuItemHeavy ion-text-left"> Weekly Ad </ion-label>
        <ion-note slot="end">
          <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
        </ion-note>
      </ion-item> -->
      <ion-item detail="false" [hidden]="!user" [routerLink]="['/shopping-list']">
        <ion-label class="cus-menuItemHeavy ion-text-left"> My Lists </ion-label>
        <ion-note slot="end">
          <ion-icon class="custom-size-icon ion-float-end ion-ios-arrow-forward-outline"></ion-icon>
        </ion-note>
      </ion-item>

    </ion-list>
    <ion-row *ngIf="isTeamMember && user" margin-top>
      <ion-col class="ion-text-center">
        <ion-button color="secondary" class="l-btn" (click)="utils.openInaAppBrowser(links.teamMember)"
          >Team Members
        </ion-button>
      </ion-col>
    </ion-row>
  </ng-container>
  <ion-row *ngIf="isTeamMember && user" margin-top>
    <ion-col class="ion-text-center">
      <ion-button color="secondary" class="l-btn" (click)="utils.openInaAppBrowser(links.teamMember)"
        >Team Members
      </ion-button>
    </ion-col>
  </ion-row>
  <ion-row *ngIf="!!user" margin-top>
    <ion-col class="ion-text-center">
      <ion-button (click)="logOut()" class="l-btn btn-default-theme">{{ 'login.logOut' | translate }}</ion-button>
    </ion-col>
  </ion-row>
  <ion-row *ngIf="!user" margin-top>
    <ion-col class="ion-text-center">
      <ion-button (click)="logInSignUp()" class="l-btn btn-default-theme"
        >{{ 'login.login' | translate }}/ {{ 'login.signUp' | translate }}</ion-button
      >
    </ion-col>
  </ion-row>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>
