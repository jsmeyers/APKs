<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>

<ion-header>
  <ion-toolbar class="cus-toolbar">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="home" text="" icon="md-arrow-back" class="dark"></ion-back-button>
    </ion-buttons>
    <ion-title text-center>Guest Survey</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <div class="text-content">
    Where Do You <br />
    Shop With Us?
  </div>

  <ion-row>
    <ion-item class="button-item">
      <button
        ion-button
        (click)="
          utils.openInaAppBrowser('https://albertsons.az1.qualtrics.com/jfe/form/SV_6WEsX4eEQbIGu4R?Banner=united')
        "
      >
        Grocery Store
      </button>
    </ion-item>

    <ion-item class="button-item">
      <button
        ion-button
        (click)="utils.openInaAppBrowser('https://albertsons.az1.qualtrics.com/jfe/form/SV_0Nis4kLulr3nBUV')"
      >
        Online Grocery Store
      </button>
    </ion-item>

    <ion-item class="button-item">
      <button
        ion-button
        (click)="utils.openInaAppBrowser('https://albertsons.az1.qualtrics.com/jfe/form/SV_9ST7PNu6qHsSqFL')"
      >
        Fuel/Convenience Store
      </button>
    </ion-item>
  </ion-row>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>
