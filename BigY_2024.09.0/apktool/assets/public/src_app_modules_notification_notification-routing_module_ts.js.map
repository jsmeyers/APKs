<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center"></widget-layout>
<app-header [isSimpleHeader]="true" [isShowBackButton]="true">
  <ion-title class="title-header">{{ 'header.messageCenter' | translate }}</ion-title>
  <ion-back-button
    class="custom-back-btn"
    defaultHref="/tabs/home"
    text=""
    icon="md-arrow-back"
    (click)="returnHome()"
  ></ion-back-button>
</app-header>
<ion-content class="ion-padding-horizontal notification" scrollY="false">
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <div [innerHTML]="notificationWidgets | safeHtml"></div>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>
