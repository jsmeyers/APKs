<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Sticky"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Top"></widget-layout>
<widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Fixed Center "></widget-layout>
<app-header [isSimpleHeader]="true" [isShowBackButton]="true">
  <ion-title class="title-header">{{ 'header.order' | translate }} #{{ orderNumber }}</ion-title>
  <ion-back-button
    class="custom-back-btn"
    defaultHref="/order/order-history"
    text=""
    icon="md-arrow-back"
  ></ion-back-button>
</app-header>

<ion-content>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Top"></widget-layout>
  <div *ngIf="dxpOrderDetailReady">
    <mag-order-detail [order]="order"></mag-order-detail>
  </div>
  <widget-layout type="page" [objectId]="" [slug]="router.url" zoneName="Bottom"></widget-layout>
</ion-content>

<ion-footer *ngIf="showPickingOrder && curbsideLink && curbsideCheckReady">
  <ion-toolbar class="toolbar">
    <div *ngIf="renderMethod === 0" class="picking">
      <div>
        <div class="picking__desc">Let us know when you’re on the way and we'll have your order ready.</div>
      </div>
      <button class="button-pickup" (click)="postUserLocation()" expand="block">
        {{ pickingOrderContent }}
      </button>
      <button class="button-at-store" (click)="walkInPickup()" expand="block">Already at the store? Check In</button>
    </div>

    <div *ngIf="renderMethod === 1" class="picking">
      <button class="button-pickup" (click)="handleClickContinuePickup()" expand="block">Continue Pickup</button>
    </div>

    <div *ngIf="renderMethod === 2" class="picking">
      <div>
        <div class="checkin__desc">Already at the store?</div>
      </div>
      <button class="button-pickup" (click)="walkInPickup()" expand="block">Check In</button>
    </div>

    <div *ngIf="renderMethod === 3" class="picking">
      <div>
        <div class="checkin__desc">Let us know when you’re on the way and we'll have your order ready.</div>
      </div>
      <button class="button-pickup" (click)="postUserLocation()" expand="block">Start Pickup</button>
    </div>
  </ion-toolbar>
</ion-footer>
